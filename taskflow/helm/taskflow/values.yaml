app:
  name: taskflow
  version: "1.0.0"
  environment: development

replicaCount: 2

image:
  repository: taskflow
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: false
  className: nginx
  host: taskflow.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

secret:
  name: taskflow-secret
  appSecret: "change-me"
